name: Deploy to GitHub Pages

# GitHub Pages is a static file host: it never runs a build. Pointing it at the
# repository root served the *source* index.html, whose
# `<script type="module" src="/src/main.jsx">` 404s (absolute path ignores the
# /<repo>/ prefix) and is untransformed JSX served as text/jsx that no browser
# will execute. Result: an empty #root and a blank white page. This workflow runs
# the Vite build and publishes dist/ instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages mints an OIDC token to publish the artifact.
  id-token: write

# Never cancel a deploy midway; just let a newer push queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vite 8 and @vitejs/plugin-react 6 require ^20.19.0 || >=22.12.0.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Tries to flip the Pages source from "deploy from a branch" to
          # "GitHub Actions". This is best-effort only: on a repo where Pages is
          # already enabled in branch mode the API call does not override the
          # existing config, so the Settings > Pages change still has to be made
          # by hand. The verify step in the deploy job catches it if it wasn't.
          enablement: true

      - name: Resolve base path
        env:
          FROM_PAGES: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # configure-pages reports the right prefix for both project sites
          # ("/repo") and user sites ("/"). Falling back to the repo name keeps an
          # unexpected or empty API response from silently producing a
          # root-relative build, which would 404 on a project site.
          BASE="${FROM_PAGES:-/$REPO_NAME}"
          echo "BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Building with base: $BASE"

      - name: Build
        env:
          # Optional. Absent secrets leave both values empty, which src/lib/analytics.js
          # already treats as "analytics disabled" rather than erroring.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        # BASE_PATH comes from the step above via $GITHUB_ENV.
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the deployed site is the built output
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # If Pages is still on "deploy from a branch", GitHub's legacy builder
          # runs on the same push and can finish *after* this job, overwriting the
          # deployment with the unbuilt repository root. That left this workflow
          # green while the live site served a blank page. Detect it and fail.
          #
          # Only positive evidence of the legacy overwrite is treated as a
          # failure; network hiccups and CDN lag just warn, so a working deploy is
          # never reported as broken.
          for i in $(seq 1 12); do
            sleep 10
            HTML="$(curl -fsSL "$URL" || true)"
            case "$HTML" in
              *"/assets/index-"*)
                echo "Verified: $URL is serving the built bundle."
                exit 0
                ;;
              *"/src/main.jsx"*)
                echo "::warning::Attempt $i/12: still serving unbuilt source, retrying."
                ;;
              *)
                echo "::warning::Attempt $i/12: no usable response yet, retrying."
                ;;
            esac
          done

          case "$HTML" in
            *"/src/main.jsx"*)
              echo "::error::$URL is serving unbuilt source, so this deployment was overwritten."
              echo "Fix: Settings > Pages > Source -> 'GitHub Actions'."
              echo "It is currently on 'Deploy from a branch', and that builder wins because it runs last."
              exit 1
              ;;
            *)
              echo "::warning::Could not confirm the deployment (CDN lag or transient error). Not failing."
              ;;
          esac
